# Full climtools runtime environment. Every package below is imported
# somewhere in climtools's own source, or (cdo, nco, ffmpeg) invoked as a
# subprocess. Excludes mpi4py and netCDF4: those are built and pinned in
# place by env/setup_env.sh against a parallel-enabled MPI/HDF5/NetCDF-C
# stack (HPC environment modules, or a source build — never a distro
# package manager, which is not available on HPC login/compute nodes), and
# re-solving them here would silently replace that build with a serial one.
#
# Applied automatically by env/setup_env.sh; to apply by hand instead:
#
#   conda env update -n climtools -f environment.yml
#
name: climtools
channels:
  - conda-forge
dependencies:
  - python>=3.12
  - numpy
  - pandas
  - scipy
  - xarray
  - dask
  - distributed
  - cftime
  - cf_xarray
  - matplotlib
  - cartopy
  - seaborn
  - cmocean
  - pymannkendall
  - ipython
  - rich
  - xesmf>=0.9.2
  - cdo
  - nco
  - ffmpeg
  # bottleneck: not imported by climtools itself, only pulled in by xarray's
  # DataArray.bfill()/.ffill(), which tests/test_mpi_reductions.py uses to
  # build its serial reference for first()/last(). Without it, `mpirun ...
  # python -m mpi4py tests/test_mpi.py` (per this repo's own README/test.sh)
  # fails with ModuleNotFoundError partway through the suite.
  - bottleneck
  - pip:
      - ruff
